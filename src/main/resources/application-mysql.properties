# ---------------------------------------------------------------------------
# MYSQL PROFILE: run with -Dspring-boot.run.profiles=mysql
# Create the schema first:  CREATE DATABASE cafepos;
# Override credentials with env vars DB_USER / DB_PASS if needed.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/cafepos?createDatabaseIfNotExist=true&serverTimezone=Africa/Lusaka
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080
