# ---------------------------------------------------------------------------
# DEFAULT PROFILE: file-based H2. Zero setup - `mvn spring-boot:run` just works.
# The database file lives in ./data/cafepos.mv.db and survives restarts.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/cafepos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev convenience: see template edits without restarting.
spring.thymeleaf.cache=false

server.port=8080
