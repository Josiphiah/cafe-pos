<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, body)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Café POS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!--
  SKELETON — shared base layout on main.
  Every page starts with:
    <html th:replace="~{layout :: page(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
    <head><title>My Page</title></head>
    <body><main class="content"> ...page content... </main></body>
    </html>
  Put page-specific CSS in app.css under a section comment for your slice — do not
  restyle this file inside a feature slice.
-->
<header class="topbar">
    <a class="brand" th:href="@{/}">☕ Café POS</a>
    <nav>
        <a th:href="@{/sales}">New Sale</a>
        <a th:href="@{/history}">Transactions</a>
        <a th:href="@{/customers}">Customers</a>
        <a th:href="@{/catalog}">Menu</a>
        <a th:href="@{/staff}" sec:authorize="hasRole('MANAGER')">Staff</a>
    </nav>
    <span class="who">
        <span sec:authorize="isAuthenticated()" sec:authentication="name">user</span>
        <!-- Spring Security logout is POST-only when CSRF is on; Thymeleaf adds the _csrf field. -->
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit">Logout</button>
        </form>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
    </span>
</header>

<div th:replace="${body}">
    <main class="content">Page content goes here.</main>
</div>

<footer class="foot">Advanced Software Engineering Project · Café POS</footer>
</body>
</html>
