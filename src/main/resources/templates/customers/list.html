<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Customers · Café POS</title></head>
<body>
<main class="content">
    <div class="page-head">
        <div>
            <h1>Customers</h1>
            <p>Returning customers, matched by phone at the till.</p>
        </div>
        <a class="btn" th:href="@{/customers/new}">+ Register customer</a>
    </div>

    <div class="tiles">
        <div class="tile tile--yellow">
            <div class="n" th:text="${customerCount}">0</div>
            <div class="l">Customers on file</div>
        </div>
    </div>

    <div class="panel">
        <p class="flash ok" th:if="${success}" th:text="${success}"></p>
        <p class="flash err" th:if="${error}" th:text="${error}"></p>

        <form method="get" th:action="@{/customers}" class="inline-form" style="margin-bottom:16px">
            <input type="text" name="q" th:value="${q}" placeholder="Search by name" style="max-width:280px">
            <button class="btn" type="submit">Search</button>
            <a th:if="${q != null and !q.isEmpty()}" th:href="@{/customers}">Clear</a>
        </form>

        <p th:if="${#lists.isEmpty(rows)}" class="muted">No customers found.</p>

        <table th:unless="${#lists.isEmpty(rows)}">
            <thead>
            <tr><th>Name</th><th>Phone</th><th class="num">Purchases</th><th class="num">Spent (K)</th><th>On file since</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td><a th:href="@{/customers/{id}(id=${r.customer.id})}" th:text="${r.customer.name}">Name</a></td>
                <td th:text="${r.customer.phone != null ? r.customer.phone : '—'}">—</td>
                <td class="num" th:text="${r.purchases}">0</td>
                <td class="num" th:text="${#numbers.formatDecimal(r.spend, 1, 2)}">0.00</td>
                <td th:text="${#temporals.format(r.customer.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                <td>
                    <form method="post" th:action="@{'/customers/' + ${r.customer.id} + '/delete'}"
                          onsubmit="return confirm('Remove this customer?');">
                        <button class="btn danger tiny" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
